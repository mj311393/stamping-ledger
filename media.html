<script src="assets/media.js"></script>
<script>
const KIND={p:'现场照片',v:'现场视频'};
const grid=document.getElementById('grid'),cnt=document.getElementById('cnt');
let cur='all',kw='';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function card(x){
  const media = x.k==='v'
    ? '<video src="'+x.src+'" poster="'+x.poster+'" preload="none" playsinline muted></video><span class="play">▶</span>'
    : '<img src="'+x.src+'" loading="lazy" alt="'+esc(x.title)+'">';
  return '<article class="mcard" data-k="'+x.k+'" data-id="'+x.id+'">'+
   '<div class="thumb">'+media+'</div>'+
   '<div class="mbody"><div class="mtop"><span class="badge '+x.k+'">'+x.id+'</span><span class="kw">'+KIND[x.k]+'</span></div>'+
   '<b>'+esc(x.title)+'</b><div class="mrow">'+esc(x.date)+' '+esc(x.shift)+'　'+esc(x.prod)+'</div></div></article>';
}
function render(){
  const list=MEDIA.filter(x=>(cur==='all'||x.k===cur)&&(!kw||((x.title+x.prod+x.desc+x.note+x.id).toLowerCase().includes(kw))));
  grid.innerHTML=list.map(card).join('')||'<p style="color:#6b7684">没有匹配的内容。</p>';
  cnt.textContent='共 '+list.length+' 项（照片 '+MEDIA.filter(x=>x.k==='p').length+' / 视频 '+MEDIA.filter(x=>x.k==='v').length+'）';
  document.querySelectorAll('.mcard').forEach(el=>el.addEventListener('click',()=>open(el.dataset.id)));
}
const modal=document.getElementById('modal'),mbody=document.getElementById('mbody');
function open(id){
  const x=MEDIA.find(v=>v.id===id);if(!x)return;
  const media = x.k==='v'
    ? '<video src="'+x.src+'" poster="'+x.poster+'" controls autoplay playsinline style="max-height:68vh"></video>'
    : '<img src="'+x.src+'" alt="">';
  mbody.innerHTML='<div class="mhead"><span class="badge '+x.k+'">'+x.id+'</span><b>'+esc(x.title)+'</b></div>'+
    '<div class="mmeta">'+esc(x.date)+' '+esc(x.shift)+'　'+esc(x.prod)+'　'+KIND[x.k]+'　'+x.kb+' KB</div>'+
    media+
    '<p class="mtext">'+esc(x.desc||'')+'</p>'+
    (x.note?'<p class="mtext note">'+esc(x.note)+'</p>':'');
  modal.classList.add('on');
}
document.getElementById('close').addEventListener('click',()=>{modal.classList.remove('on');mbody.innerHTML='';});
modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.remove('on');mbody.innerHTML='';}});
document.querySelectorAll('#chips button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#chips button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  cur=b.dataset.k;render();}));
document.getElementById('q').addEventListener('input',e=>{kw=e.target.value.trim().toLowerCase();render();});
render();
</script>

<footer><b>冯国庆 · H0362</b><br>冲压车间质量工作台账 · 成果展示<br>影像为现场记录，编号与台账条目对应</footer>

<style id="gate-style">
html.gate-locked body{visibility:hidden}
html.gate-locked #gate,html.gate-locked #gate *{visibility:visible}
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#16202b,#243447 60%,#2c4557);padding:20px}
#gate .box{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:24px 22px;text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.35)}
#gate .kk{font-size:11.5px;letter-spacing:.18em;color:#93a0ae;margin:0 0 8px}
#gate h2{margin:0 0 4px;font-size:20px}

#gate button{width:100%;margin-top:12px;font:inherit;font-size:16px;font-weight:700;padding:11px;border:none;border-radius:11px;
  background:#16202b;color:#fff;cursor:pointer}
#gate .err{color:#b3253a;font-size:13px;margin-top:10px;min-height:18px}
#gate .tip{color:#93a0ae;font-size:11.5px;margin-top:14px;line-height:1.5}
</style>
<div id="gate">
  <div class="box">
    <p class="kk">SAIC · STAMPING</p>
    <h2>请输入访问口令</h2>
    <p>冲压车间质量工作台账 · 内部资料</p>
    <input id="gate-pw" type="password" inputmode="text" autocomplete="off" placeholder="口令">
    <button id="gate-go">进入</button>
    <div class="err" id="gate-err"></div>
    <div class="tip">口令由车间内部掌握，请勿外传。</div>
  </div>
</div>
<script>
(function(){
  var H = "e247b91ad36e56e2de99f3a7a3e65de635f39470b58ce51d439cc85886f07fef";
  var doc = document.documentElement;
  function unlock(){ doc.classList.remove("gate-locked"); var g=document.getElementById("gate"); if(g) g.remove(); }
  try{ if(sessionStorage.getItem("sq_ok")==="1"){ unlock(); return; } }catch(e){}
  doc.classList.add("gate-locked");
  function go(){
    var v = document.getElementById("gate-pw").value;
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)).then(function(buf){
      var hex = Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("");
      if(hex === H){ try{ sessionStorage.setItem("sq_ok","1"); }catch(e){} unlock(); }
      else { document.getElementById("gate-err").textContent = "口令不对，请重新输入"; }
    });
  }
  document.getElementById("gate-go").addEventListener("click", go);
  document.getElementById("gate-pw").addEventListener("keydown", function(e){ if(e.key==="Enter") go(); });
  document.getElementById("gate-pw").focus();
})();
</script>
<!--GATE-END-->
